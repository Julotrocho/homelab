services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - vitrine
    depends_on:
      - contact-api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - ./api/.env
    environment:
      - POSTGRES_USER=contact
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=contacts
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact"]
      interval: 3s
      retries: 5
    networks:
      - vitrine
    restart: unless-stopped

  contact-api:
    build: ./api
    env_file:
      - ./api/.env
    networks:
      - vitrine
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  vitrine:

volumes:
  db-data:
