services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - vitrine
    depends_on:
      - contact-api
    restart: unless-stopped

  contact-api:
    build: ./api
    networks:
      - vitrine
    restart: unless-stopped

networks:
  vitrine:
